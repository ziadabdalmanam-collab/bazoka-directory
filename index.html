<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BAZOKA — دليل الأرقام</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
 <header class="site-header">
  <div class="brand">
    <div class="eagle">🦅</div>
    <div class="bazoka">BAZOKA</div>
    <img class="logo" src="logo.png" alt="شعار الشركة" />
  </div>
</header>


  <main class="container">
    <section class="hero">
      <h1>دليل أرقام الشركة الوطنية للثروة السمكية</h1>
      <p class="subtitle">ابحث بالاسم أو القسم</p>
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="اكتب الاسم أو القسم..." />
        <button id="searchBtn">بحث</button>
      </div>
    </section>

    <section id="result" class="result-area"></section>

    <section id="list" class="list-area">
      <h2>جميع الإدارات</h2>
      <ul id="contactsList"></ul>
    </section>

    <section id="contact" class="contact-card">
      <h3>تواصل معنا</h3>
      <p>الموقع تجريبي محلي من إعداد BAZOKA.</p>
    </section>
  </main>

  <footer class="site-footer">
    © 2025 — تصميم BAZOKA
  </footer>

  <script src="script.js"></script>
</body>
</html>
